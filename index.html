<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>สะพานสมการข้ามลาวา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D board. HUD floats on top: equation + lives/progress at the top, toast/tip/controls at the bottom. One committed dark look (basalt + magma). */
:root {
  --bg: #150e0d;
  --ink: #f6ece1;
  --ink-dim: #cdbbab;
  --ember: #ff6a1f;
  --magma: #ffc233;
  --stone: #43c6b0;
  --danger: #ff5d4a;
  --panel: rgba(26, 17, 15, 0.84);
  --line: rgba(255, 194, 51, 0.3);
  --display: "Chakra Petch", "Noto Sans Thai", system-ui, sans-serif;
  --body: "Noto Sans Thai", "Chakra Petch", system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  touch-action: none;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.eqcard { padding: 10px 16px 12px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.04em; color: var(--ink-dim); }
.eq {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 8vw, 42px); line-height: 1.15;
  color: var(--magma); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.eq.sm { font-size: clamp(17px, 4.6vw, 24px); white-space: normal; line-height: 1.3; }
.eq .v { color: var(--ink); font-style: italic; }
.status {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; min-width: 0;
}
.hearts { display: flex; gap: 4px; }
.heart { color: var(--danger); font-size: 20px; line-height: 1; }
.heart.lost { color: #5b4540; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pip { width: 14px; height: 8px; border-radius: 2px; border: 1px solid var(--line); }
.pip.on { background: var(--stone); border-color: var(--stone); }
.coord { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

.bottom {
  display: flex; flex-direction: column; gap: 10px;
  width: 100%; max-width: 560px; margin-inline: auto;
}
.toast {
  align-self: center; max-width: 100%;
  padding: 10px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.good { border-color: var(--stone); color: #bff3e9; }
.toast.bad { border-color: var(--danger); color: #ffd0c9; }
.tip, .hint, .arbar { padding: 12px 14px; font-size: 14px; }
.tip p, .hint p, .arbar p { margin: 0; }
.tip p + p { margin-top: 4px; color: var(--ink-dim); }
.hint { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.hint .calc { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--magma); font-variant-numeric: tabular-nums; }
.hint .x { flex: none; }
.arbar { display: flex; flex-direction: column; gap: 10px; }
.arbar .row { flex-wrap: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  pointer-events: auto; flex: 1 1 0; min-width: 76px; min-height: 46px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 600 14px/1.2 var(--display); border-radius: 12px; cursor: pointer; padding: 8px 6px;
}
.btn:hover { border-color: var(--magma); }
.btn:focus-visible { outline: 2px solid var(--magma); outline-offset: 2px; }
.btn.primary { background: var(--ember); border-color: var(--ember); color: #1b0d07; }
.btn.small { flex: none; min-width: 44px; min-height: 36px; padding: 4px 10px; }
.btn[aria-disabled="true"] { opacity: 0.62; }

#modal {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: 16px; background: rgba(10, 6, 5, 0.64); pointer-events: auto;
}
.sheet {
  width: 100%; max-width: 400px; max-height: 100%; overflow: auto;
  padding: 22px 20px 20px; text-align: center;
  background: #231713; border: 1px solid var(--line); border-radius: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.sheet h2 { margin: 0; font: 700 28px/1.2 var(--display); color: var(--magma); text-wrap: balance; }
.sheet p { margin: 0; color: var(--ink-dim); }
.stars { font-size: 38px; letter-spacing: 6px; color: #4a3a33; line-height: 1; }
.stars .on { color: var(--magma); }
.pts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0; margin: 0; list-style: none; }
.pts li { font: 600 14px var(--display); padding: 3px 9px; border-radius: 8px; border: 1px solid var(--stone); color: #bff3e9; font-variant-numeric: tabular-nums; }
.lvlist { display: grid; gap: 8px; }
.lv { display: flex; align-items: center; gap: 12px; text-align: left; flex: none; width: 100%; min-height: 52px; padding: 8px 12px; }
.lv .n { font: 700 20px var(--display); color: var(--magma); width: 22px; text-align: center; }
.lv .t { display: flex; flex-direction: column; min-width: 0; }
.lv .t small { font: 500 12px var(--display); color: var(--ink-dim); }
.lv .s { margin-left: auto; color: var(--magma); letter-spacing: 2px; white-space: nowrap; }
.lv.cur { border-color: var(--magma); }
#nogl { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<canvas id="stage" role="img" aria-label="กระดานเกมสามมิติ: ตารางกราฟบนบ่อลาวา"></canvas>

<div id="hud">
  <div class="top">
    <div class="card eqcard">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="eq" id="eq"></div>
    </div>
    <div class="status">
      <div class="hearts" id="hearts" aria-label="พลังชีวิต"></div>
      <div class="progress"><div class="pips" id="pips"></div><span id="count">0/6</span></div>
      <div class="coord" id="coord">แตะเพื่อเลือกช่อง</div>
    </div>
  </div>

  <div class="bottom">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="tip" class="card tip">
      <p><b>วิธีเล่น</b> แตะพื้นเพื่อวางหินที่จุด (x, y) ที่อยู่บนเส้นของสมการ</p>
      <p id="tip2">วางถูกหินจะลอยอยู่ วางผิดหินจะจมลาวา · ลากนิ้วเพื่อหมุนมุมมอง บีบนิ้วเพื่อซูม</p>
    </div>
    <div id="hint" class="card hint" hidden>
      <div><p class="calc" id="hintCalc"></p></div>
      <button class="btn small" id="hintClose" aria-label="ปิดคำใบ้">✕</button>
    </div>
    <div id="arbar" class="card arbar" hidden>
      <p id="arMsg">ขยับมือถือช้า ๆ ส่องพื้น</p>
      <div class="row">
        <button class="btn" id="sizeDown" aria-label="ลดขนาดสนาม">สนามเล็กลง</button>
        <button class="btn" id="sizeUp" aria-label="เพิ่มขนาดสนาม">สนามใหญ่ขึ้น</button>
        <button class="btn primary" id="placeBtn">วางเลย</button>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="hintBtn">คำใบ้</button>
      <button class="btn" id="resetBtn">เริ่มใหม่</button>
      <button class="btn" id="levelBtn">ด่าน 1/6</button>
      <button class="btn" id="moveBtn" hidden>ย้ายสนาม</button>
      <button class="btn primary" id="arBtn" aria-disabled="true">โหมด AR</button>
    </div>
  </div>

  <div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<div id="nogl" hidden><p>เปิดกราฟิก 3 มิติไม่ได้ในเบราว์เซอร์นี้ ลองใช้ Chrome หรือ Safari เวอร์ชันล่าสุด</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  if (!window.THREE) { $('nogl').hidden = false; return; }

  var fmt = function (n) { return String(n).replace('-', '−'); };
  var pr = function (x) { return x < 0 ? '(' + fmt(x) + ')' : String(x); };
  var V = function (c) { return '<span class="v">' + c + '</span>'; };

  /* ---------- Levels ---------- */
  var LEVELS = [
    { title: 'อุ่นเครื่อง', short: 'y = x + 1',
      eqHTML: V('y') + ' = ' + V('x') + ' + 1', aria: 'y เท่ากับ x บวก 1',
      f: function (x) { return x + 1; }, xr: [-4, 5], yr: [-1, 4],
      calc: function (x) { return 'y = ' + pr(x) + ' + 1 = ' + fmt(x + 1); },
      start: 'ด่านนี้ง่ายที่สุด: เลือก x แล้วบวก 1 จะได้ y',
      tip: 'เมื่อ x เพิ่มขึ้น 1 ค่า y จะเพิ่มขึ้น 1 และเมื่อ x = 0 จะได้ y = 1' },
    { title: 'ก้าวกระโดด', short: 'y = 2x − 3',
      eqHTML: V('y') + ' = 2' + V('x') + ' − 3', aria: 'y เท่ากับ 2x ลบ 3',
      f: function (x) { return 2 * x - 3; }, xr: [-3, 5], yr: [-6, 6],
      calc: function (x) { return 'y = 2(' + fmt(x) + ') − 3 = ' + fmt(2 * x - 3); },
      start: 'ความชัน 2: หินแต่ละก้อนห่างกัน 1 ช่องแนวนอน และ 2 ช่องแนวตั้ง',
      tip: 'เมื่อ x เพิ่มขึ้น 1 ค่า y จะเพิ่มขึ้น 2 เสมอ และเมื่อ x = 0 จะได้ y = −3' },
    { title: 'ทางลง', short: 'y = −x + 4',
      eqHTML: V('y') + ' = −' + V('x') + ' + 4', aria: 'y เท่ากับลบ x บวก 4',
      f: function (x) { return 4 - x; }, xr: [-3, 6], yr: [0, 5],
      calc: function (x) { return 'y = −(' + fmt(x) + ') + 4 = ' + fmt(4 - x); },
      start: 'ความชันติดลบ: เมื่อ x มากขึ้น y จะน้อยลง สะพานจะเอียงไปทางซ้าย',
      tip: 'เมื่อ x เพิ่มขึ้น 1 ค่า y จะลดลง 1 และเมื่อ x = 0 จะได้ y = 4' },
    { title: 'ครึ่งก้าว', short: 'y = ½x + 1',
      eqHTML: V('y') + ' = ½' + V('x') + ' + 1', aria: 'y เท่ากับ x ส่วนสอง บวก 1',
      f: function (x) { return x / 2 + 1; }, xr: [-3, 7], yr: [0, 4],
      calc: function (x) { return 'y = ½ × ' + pr(x) + ' + 1 = ' + fmt(x / 2 + 1); },
      start: 'ความชัน ½: x ที่เป็นเลขคี่จะได้ y เป็นเศษส่วน จึงวางหินไม่ได้',
      tip: 'ความชัน ½ หมายถึง x เพิ่มขึ้น 2 ค่า y จึงเพิ่มขึ้น 1 มีแต่ x เลขคู่ที่ได้ y เป็นจำนวนเต็ม' },
    { title: 'จัดรูปสมการ', short: '2x + y = 6',
      eqHTML: '2' + V('x') + ' + ' + V('y') + ' = 6', aria: '2x บวก y เท่ากับ 6',
      f: function (x) { return 6 - 2 * x; }, xr: [-2, 7], yr: [-5, 7],
      calc: function (x) { return '2(' + fmt(x) + ') + y = 6 → y = 6 − 2(' + fmt(x) + ') = ' + fmt(6 - 2 * x); },
      start: 'สมการอยู่ในรูปที่ y ยังไม่เดี่ยว ลองย้ายข้างให้ได้ y = ... ก่อน',
      tip: 'ย้ายข้างจะได้ y = 6 − 2x เมื่อ x เพิ่มขึ้น 1 ค่า y จะลดลง 2' },
    { title: 'ด่านบอส: หาเส้นเอง', short: 'เส้นผ่าน A(0, −4) และ B(3, 2)',
      eqHTML: 'เส้นตรงผ่านจุด A(0, −4) และ B(3, 2)', aria: 'เส้นตรงผ่านจุด A 0, ลบ 4 และ B 3, 2', small: true,
      f: function (x) { return 2 * x - 4; }, xr: [-3, 6], yr: [-5, 5],
      given: [{ x: 0, y: -4 }, { x: 3, y: 2 }],
      intro: 'ความชัน = (2 − (−4)) ÷ (3 − 0) = 2 และตัดแกน y ที่ −4 จึงได้ y = 2x − 4',
      calc: function (x) { return 'y = 2(' + fmt(x) + ') − 4 = ' + fmt(2 * x - 4); },
      start: 'ไม่มีสมการให้ จุด A และ B มีหินวางไว้แล้ว ให้หาเส้นที่ผ่านทั้งสองจุดแล้ววางหินที่เหลือ',
      tip: 'หาความชันก่อน: (y₂ − y₁) ÷ (x₂ − x₁) แล้วนำจุดใดจุดหนึ่งไปหา b ใน y = mx + b' }
  ];

  /* mutable level state */
  var levelIdx = 0, L = LEVELS[0];
  var XMIN, XMAX, YMIN, YMAX, CX, CY, GW, GH, needed = [], START, GOAL;
  var key = function (x, y) { return x + ',' + y; };
  var inRange = function (c) { return c.x >= XMIN && c.x <= XMAX && c.y >= YMIN && c.y <= YMAX; };
  var isInt = function (v) { return Math.abs(v - Math.round(v)) < 1e-9; };

  /* stars saved per level */
  function loadStars() { try { return JSON.parse(localStorage.getItem('lavaBridgeStars') || '[]'); } catch (e) { return []; } }
  function saveStar(i, n) {
    try { var a = loadStars(); if (!a[i] || a[i] < n) a[i] = n; localStorage.setItem('lavaBridgeStars', JSON.stringify(a)); } catch (e) {}
  }

  /* ---------- Renderer / scene ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('stage'), antialias: true, alpha: true });
  } catch (e) { $('nogl').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;

  var bgColor = new THREE.Color(0x150e0d);
  var scene = new THREE.Scene();
  scene.background = bgColor;
  var camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
  scene.add(new THREE.HemisphereLight(0xffe2c8, 0x3a1a10, 0.95));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(3, 8, 5);
  scene.add(sun);

  var root = new THREE.Group(); scene.add(root);
  var board = new THREE.Group(); root.add(board);
  var staticG = null, flag = null;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timeScale = reduceMotion ? 0.3 : 1;

  /* shared materials */
  var lavaMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec2 vP; uniform float uTime;' +
      'void main(){' +
      ' float a = sin(vP.x*2.3 + uTime*0.7) + sin(vP.y*2.1 - uTime*0.9) + sin((vP.x+vP.y)*1.7 + uTime*0.5) + sin(length(vP - vec2(1.0,0.0))*2.6 - uTime*1.1);' +
      ' float t = a*0.25 + 0.5;' +
      ' vec3 dark = vec3(0.42,0.07,0.03); vec3 mid = vec3(0.95,0.28,0.05); vec3 hot = vec3(1.0,0.74,0.2);' +
      ' vec3 c = mix(dark, mid, smoothstep(0.15,0.6,t)); c = mix(c, hot, smoothstep(0.62,0.95,t));' +
      ' gl_FragColor = vec4(c, 1.0); }'
  });
  var basalt = new THREE.MeshStandardMaterial({ color: 0x2b2320, roughness: 0.92 });
  var startBankMat = new THREE.MeshStandardMaterial({ color: 0x2f5550, roughness: 0.85 });
  var goalBankMat = new THREE.MeshStandardMaterial({ color: 0x7d6226, roughness: 0.85 });
  var axisMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
  var gridMat = new THREE.LineBasicMaterial({ color: 0xffb366, transparent: true, opacity: 0.38 });
  var poleMat = new THREE.MeshStandardMaterial({ color: 0xe8dccf });
  var flagMat = new THREE.MeshBasicMaterial({ color: 0xff6a1f, side: THREE.DoubleSide });

  /* ---------- Sprites (labels) ---------- */
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function makeSprite(text, o) {
    var w = o.w || 128, h = o.h || 128;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d');
    if (o.bg) { g.fillStyle = o.bg; rr(g, 2, 2, w - 4, h - 4, h / 3); g.fill(); }
    g.font = '700 ' + (o.size || 64) + 'px "Chakra Petch","Noto Sans Thai",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!o.bg) { g.lineWidth = 9; g.lineJoin = 'round'; g.strokeStyle = 'rgba(15,9,8,0.9)'; g.strokeText(text, w / 2, h / 2 + 3); }
    g.fillStyle = o.color || '#fff'; g.fillText(text, w / 2, h / 2 + 3);
    var tex = new THREE.CanvasTexture(c);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
    var sc = o.scale || 0.8;
    s.scale.set(sc * w / h, sc, 1); s.renderOrder = 10;
    return s;
  }
  var fontsDone = false;
  Promise.race([
    Promise.all([
      document.fonts.load('700 48px "Chakra Petch"'),
      document.fonts.load('700 48px "Noto Sans Thai"', 'เริ่ม')
    ]).catch(function () {}),
    new Promise(function (r) { setTimeout(r, 1500); })
  ]).then(function () { fontsDone = true; if (staticG && !staticG.userData.labeled) addLabels(staticG); });

  function addLabels(g) {
    g.userData.labeled = true;
    var i, s;
    for (i = XMIN; i <= XMAX; i++) {
      s = makeSprite(fmt(i), { color: '#ffe3b0', scale: 0.5 }); s.position.set(i, 0.3, 0.55); g.add(s);
    }
    for (i = YMIN; i <= YMAX; i++) {
      if (i === 0) continue;
      s = makeSprite(fmt(i), { color: '#ffe3b0', scale: 0.5 }); s.position.set(-0.58, 0.3, -i); g.add(s);
    }
    s = makeSprite('x', { color: '#ffc233', size: 80, scale: 0.7 }); s.position.set(XMAX + 0.95, 0.3, 0); g.add(s);
    s = makeSprite('y', { color: '#ffc233', size: 80, scale: 0.7 }); s.position.set(0.7, 0.3, -(YMAX + 0.6)); g.add(s);
    var sx = Math.max(XMIN, Math.min(XMAX, START.x - 2)), gx = Math.max(XMIN, Math.min(XMAX, GOAL.x + (GOAL.x - 2 < XMIN ? 2 : -2)));
    s = makeSprite('เริ่ม', { w: 256, h: 96, size: 56, color: '#0f0908', bg: '#43c6b0', scale: 0.6 });
    s.position.set(sx, 0.9, -START.y); g.add(s);

  var flatGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  var ghostFill = new THREE.Mesh(flatGeo, new THREE.MeshBasicMaterial({ color: 0x43c6b0, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false }));
  var ghostLine = new THREE.LineSegments(new THREE.EdgesGeometry(flatGeo), new THREE.LineBasicMaterial({ color: 0xffc233 }));
  ghostRoot.add(ghostFill); ghostRoot.add(ghostLine);
  function updateGhostShape() {
    if (!GW) return;
    var bw = GW + 1.2, len = GH + 4, zc = START.y - CY;
    [ghostFill, ghostLine].forEach(function (m) { m.scale.set(bw, 1, len); m.position.set(0, 0.01, zc); });
  }
  function yawToward(p, c) { return Math.atan2(-(p.x - c.x), -(p.z - c.z)); }
  function camPos(out) { var cam = renderer.xr.getCamera(camera); return out.setFromMatrixPosition(cam.matrixWorld); }

  function setArUi() {
    var on = xrActive;
    $('arBtn').textContent = on ? 'ออกจาก AR' : 'โหมด AR';
    $('arBtn').setAttribute('aria-disabled', (arOK || on) ? 'false' : 'true');
    $('arbar').hidden = !(on && !xrPlaced);
    $('moveBtn').hidden = !(on && xrPlaced);
    $('tip').hidden = on || state !== 'play' || placed.size > ((L.given || []).length);
  }
  (function detectAR() {
    try {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-ar').then(function (ok) { arOK = !!ok; setArUi(); }, function () {});
      }
    } catch (e) {}
  })();

  $('arBtn').onclick = function () {
    if (xrActive && xrSession) { xrSession.end(); return; }
    if (!arOK) { toast('AR ใช้ได้เมื่อเปิดไฟล์นี้ผ่าน HTTPS บน Android Chrome · ตอนนี้เล่นแบบ 3 มิติบนจอได้เลย'); return; }
    startAR();
  };
  async function startAR() {
    try {
      var session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('hud') }
      });
      session.addEventListener('end', onXREnd);
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      xrSession = session; xrActive = true; xrPlaced = false;
      var viewer = await session.requestReferenceSpace('viewer');
      try { hitSource = await session.requestHitTestSource({ space: viewer, entityTypes: ['plane', 'point'] }); }
      catch (e1) { hitSource = await session.requestHitTestSource({ space: viewer }); }
      scene.background = null; root.visible = false;
      lastFloorY = null; scanStart = performance.now(); lastMsg = '';
      startLevel(levelIdx);
      setArUi();
    } catch (err) {
      xrActive = false; setArUi();
      toast('เปิด AR ไม่ได้: ' + (err && err.message ? err.message : 'ไม่รองรับ'), 'bad');
    }
  }
  function onXREnd() {
    xrActive = false; xrSession = null; hitSource = null; xrPlaced = false;
    reticle.visible = false; ghostRoot.visible = false; scene.background = bgColor;
    root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.setScalar(1); root.visible = true;
    board.position.set(-CX, 0, CY);
    setArUi(); resize();
  }
  function finalizePlacement(p, cp) {
    root.position.copy(p); root.scale.setScalar(arCell());
    root.rotation.set(0, yawToward(p, cp), 0);
    board.position.set(-CX, 0, START.y);
    root.visible = true; xrPlaced = true; ghostRoot.visible = false; reticle.visible = false;
    setArUi();
    toast('วางสนามแล้ว แตะพื้นเพื่อวางหินได้เลย', 'good');
  }
  function placeHere() {
    if (!xrActive || xrPlaced) return;
    var cp = camPos(tc.clone());
    if (reticle.visible) {
      reticle.matrix.decompose(tp, tq, ts);
      finalizePlacement(tp.clone(), cp);
    } else {
      var cam = renderer.xr.getCamera(camera);
      var dir = new THREE.Vector3(0, 0, -1).applyMatrix4(new THREE.Matrix4().extractRotation(cam.matrixWorld));
      dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
      var fy = lastFloorY !== null ? lastFloorY : cp.y - 1.4;
      finalizePlacement(new THREE.Vector3(cp.x + dir.x * 1.6, fy, cp.z + dir.z * 1.6), cp);
    }
  }
  $('placeBtn').onclick = placeHere;
  $('sizeDown').onclick = function () { arMul = Math.max(0.6, +(arMul - 0.2).toFixed(1)); lastMsg = ''; };
  $('sizeUp').onclick = function () { arMul = Math.min(1.4, +(arMul + 0.2).toFixed(1)); lastMsg = ''; };
  $('moveBtn').onclick = function () {
    if (!xrActive) return;
    xrPlaced = false; root.visible = false; scanStart = performance.now(); lastMsg = ''; setArUi();
  };
  controller.addEventListener('select', function () {
    if (!xrActive) return;
    if (!xrPlaced) {
      if (reticle.visible) placeHere();
      else toast('ยังไม่เจอพื้น กด "วางเลย" เพื่อวางตรงหน้าได้');
      return;
    }
    tmpM.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
    var cell = cellFromRay(raycaster.ray);
    showCell(cell, false);
    if (cell) tryPlace(cell.x, cell.y);
  });
  function setArMsg(found) {
    var cell = Math.round(arCell() * 100);
    var t = found ? 'เจอพื้นแล้ว · ช่องละ ' + cell + ' ซม. · แตะหน้าจอหรือกด "วางเลย"'
      : (performance.now() - scanStart > 3500 ? 'ยังหาพื้นไม่เจอ กด "วางเลย" เพื่อวางตรงหน้าได้เลย · ช่องละ ' + cell + ' ซม.'
        : 'ขยับมือถือช้า ๆ ส่องพื้น · ช่องละ ' + cell + ' ซม.');
    if (t !== lastMsg) { lastMsg = t; $('arMsg').textContent = t; }
  }
  function xrFrame(frame) {
    if (!frame) return;
    if (xrPlaced) { reticle.visible = false; ghostRoot.visible = false; return; }
    var found = false;
    if (hitSource) {
      var hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        var pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        if (pose) {
          reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix);
          lastFloorY = pose.transform.position.y; found = true;
        }
      }
    }
    if (!found) reticle.visible = false;
    if (found) {
      reticle.matrix.decompose(tp, tq, ts);
      ghostRoot.position.copy(tp); ghostRoot.scale.setScalar(arCell());
      ghostRoot.rotation.set(0, yawToward(tp, camPos(tc)), 0);
    }
    ghostRoot.visible = found;
    setArMsg(found);
  }
  /* In AR, taps on HUD controls must not also count as a placement tap */
  Array.prototype.forEach.call(document.querySelectorAll('.card, .btn, .status, #modal'), function (el) {
    el.addEventListener('beforexrselect', function (e) { e.preventDefault(); });
  });

  /* ---------- Main loop ---------- */
  var last = performance.now();
  renderer.setAnimationLoop(function (time, frame) {
    var now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    lavaMat.uniforms.uTime.value = now / 1000 * timeScale;
    if (flag) flag.rotation.y = Math.sin(now / 400) * 0.25;
    stepFx(dt); stepHero(dt);
    if (xrActive) xrFrame(frame); else placeCamera();
    renderer.render(scene, camera);
  });

  resize();
  startLevel(0);
})();
</script>

</body></html>
