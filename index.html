<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>สะพานสมการข้ามลาวา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D board. HUD floats on top: equation + lives/progress at the top, toast/tip/controls at the bottom. One committed dark look (basalt + magma). */
:root {
  --bg: #150e0d;
  --ink: #f6ece1;
  --ink-dim: #cdbbab;
  --ember: #ff6a1f;
  --magma: #ffc233;
  --stone: #43c6b0;
  --danger: #ff5d4a;
  --panel: rgba(26, 17, 15, 0.84);
  --line: rgba(255, 194, 51, 0.3);
  --display: "Chakra Petch", "Noto Sans Thai", system-ui, sans-serif;
  --body: "Noto Sans Thai", "Chakra Petch", system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  touch-action: none;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.eqcard { padding: 10px 16px 12px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.04em; color: var(--ink-dim); }
.eq {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 8vw, 42px); line-height: 1.15;
  color: var(--magma); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.eq .v { color: var(--ink); font-style: italic; }
.status {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; min-width: 0;
}
.hearts { display: flex; gap: 4px; }
.heart { color: var(--danger); font-size: 20px; line-height: 1; }
.heart.lost { color: #5b4540; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; }
.pip { width: 14px; height: 8px; border-radius: 2px; border: 1px solid var(--line); }
.pip.on { background: var(--stone); border-color: var(--stone); }
.coord { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

.bottom {
  display: flex; flex-direction: column; gap: 10px;
  width: 100%; max-width: 560px; margin-inline: auto;
}
.toast {
  align-self: center; max-width: 100%;
  padding: 10px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.good { border-color: var(--stone); color: #bff3e9; }
.toast.bad { border-color: var(--danger); color: #ffd0c9; }
.tip, .hint { padding: 12px 14px; font-size: 14px; }
.tip p, .hint p { margin: 0; }
.tip p + p { margin-top: 4px; color: var(--ink-dim); }
.hint { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.hint .calc { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--magma); font-variant-numeric: tabular-nums; }
.hint .x { flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  pointer-events: auto; flex: 1 1 0; min-width: 96px; min-height: 46px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 600 15px/1.2 var(--display); border-radius: 12px; cursor: pointer; padding: 8px 12px;
}
.btn:hover { border-color: var(--magma); }
.btn:focus-visible { outline: 2px solid var(--magma); outline-offset: 2px; }
.btn.primary { background: var(--ember); border-color: var(--ember); color: #1b0d07; }
.btn.small { flex: none; min-width: 44px; min-height: 36px; padding: 4px 10px; }
.btn[aria-disabled="true"] { opacity: 0.62; }

#modal {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  padding: 16px; background: rgba(10, 6, 5, 0.64); pointer-events: auto;
}
.sheet {
  width: 100%; max-width: 400px; max-height: 100%; overflow: auto;
  padding: 22px 20px 20px; text-align: center;
  background: #231713; border: 1px solid var(--line); border-radius: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.sheet h2 { margin: 0; font: 700 28px/1.2 var(--display); color: var(--magma); text-wrap: balance; }
.sheet p { margin: 0; color: var(--ink-dim); }
.stars { font-size: 38px; letter-spacing: 6px; color: #4a3a33; line-height: 1; }
.stars .on { color: var(--magma); }
.pts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0; margin: 0; list-style: none; }
.pts li { font: 600 14px var(--display); padding: 3px 9px; border-radius: 8px; border: 1px solid var(--stone); color: #bff3e9; font-variant-numeric: tabular-nums; }
#nogl { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<canvas id="stage" role="img" aria-label="กระดานเกมสามมิติ: ตารางกราฟบนบ่อลาวา"></canvas>

<div id="hud">
  <div class="top">
    <div class="card eqcard">
      <div class="eyebrow">ด่าน 1 · วางหินบนเส้นกราฟ</div>
      <div class="eq" id="eq"></div>
    </div>
    <div class="status">
      <div class="hearts" id="hearts" aria-label="พลังชีวิต"></div>
      <div class="progress"><div class="pips" id="pips"></div><span id="count">0/6</span></div>
      <div class="coord" id="coord">แตะเพื่อเลือกช่อง</div>
    </div>
  </div>

  <div class="bottom">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="tip" class="card tip">
      <p><b>วิธีเล่น</b> แตะพื้นเพื่อวางหินที่จุด (x, y) ที่อยู่บนเส้นของสมการ</p>
      <p>วางถูกหินจะลอยอยู่ วางผิดหินจะจมลาวา · ลากนิ้วเพื่อหมุนมุมมอง บีบนิ้วเพื่อซูม</p>
    </div>
    <div id="hint" class="card hint" hidden>
      <div><p class="calc" id="hintCalc"></p></div>
      <button class="btn small" id="hintClose" aria-label="ปิดคำใบ้">✕</button>
    </div>
    <div class="row">
      <button class="btn" id="hintBtn">คำใบ้</button>
      <button class="btn" id="resetBtn">เริ่มใหม่</button>
      <button class="btn primary" id="arBtn" aria-disabled="true">โหมด AR</button>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="nogl" hidden><p>เปิดกราฟิก 3 มิติไม่ได้ในเบราว์เซอร์นี้ ลองใช้ Chrome หรือ Safari เวอร์ชันล่าสุด</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  if (!window.THREE) { $('nogl').hidden = false; return; }

  /* ---------- Level data: y = M x + B ---------- */
  var M = 2, B = -3;
  var XMIN = -3, XMAX = 5, YMIN = -6, YMAX = 6;
  var CX = (XMIN + XMAX) / 2;
  var AR_SCALE = 0.18; // metres per grid cell in AR
  var eqY = function (x) { return M * x + B; };
  var fmt = function (n) { return String(n).replace('-', '−'); };
  var needed = [];
  for (var x = XMIN; x <= XMAX; x++) {
    var yy = eqY(x);
    if (yy >= YMIN && yy <= YMAX) needed.push({ x: x, y: yy });
  }
  var START = { x: needed[0].x, y: YMIN - 1 };
  var GOAL = { x: needed[needed.length - 1].x, y: YMAX + 1 };
  var key = function (x, y) { return x + ',' + y; };
  var inRange = function (c) { return c.x >= XMIN && c.x <= XMAX && c.y >= YMIN && c.y <= YMAX; };

  $('eq').innerHTML = '<span class="v">y</span> = ' + M + '<span class="v">x</span> ' + (B < 0 ? '−' : '+') + ' ' + Math.abs(B);
  $('eq').setAttribute('aria-label', 'สมการ y เท่ากับ ' + M + 'x ' + (B < 0 ? 'ลบ' : 'บวก') + ' ' + Math.abs(B));
  $('count').textContent = '0/' + needed.length;

  /* ---------- Renderer / scene ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('stage'), antialias: true, alpha: true });
  } catch (e) { $('nogl').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.enabled = true;

  var bgColor = new THREE.Color(0x150e0d);
  var scene = new THREE.Scene();
  scene.background = bgColor;
  var camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
  scene.add(new THREE.HemisphereLight(0xffe2c8, 0x3a1a10, 0.95));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(3, 8, 5);
  scene.add(sun);

  var root = new THREE.Group(); scene.add(root);
  var board = new THREE.Group(); root.add(board);
  board.position.set(-CX, 0, 0);

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timeScale = reduceMotion ? 0.3 : 1;

  /* Lava */
  var lavaMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec2 vP; uniform float uTime;' +
      'void main(){' +
      ' float a = sin(vP.x*2.3 + uTime*0.7) + sin(vP.y*2.1 - uTime*0.9) + sin((vP.x+vP.y)*1.7 + uTime*0.5) + sin(length(vP - vec2(1.0,0.0))*2.6 - uTime*1.1);' +
      ' float t = a*0.25 + 0.5;' +
      ' vec3 dark = vec3(0.42,0.07,0.03); vec3 mid = vec3(0.95,0.28,0.05); vec3 hot = vec3(1.0,0.74,0.2);' +
      ' vec3 c = mix(dark, mid, smoothstep(0.15,0.6,t)); c = mix(c, hot, smoothstep(0.62,0.95,t));' +
      ' gl_FragColor = vec4(c, 1.0); }'
  });
  var lavaGeo = new THREE.PlaneGeometry(XMAX - XMIN + 1, YMAX - YMIN + 1);
  lavaGeo.rotateX(-Math.PI / 2);
  lavaGeo.translate(CX, 0, 0);
  board.add(new THREE.Mesh(lavaGeo, lavaMat));

  /* Rim walls and banks */
  var basalt = new THREE.MeshStandardMaterial({ color: 0x2b2320, roughness: 0.92 });
  var gridW = XMAX - XMIN + 1, gridH = YMAX - YMIN + 1;
  function addBox(w, h, d, px, py, pz, mat) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(px, py, pz); board.add(m); return m;
  }
  addBox(0.6, 0.5, gridH, XMIN - 0.8, 0, 0, basalt);
  addBox(0.6, 0.5, gridH, XMAX + 0.8, 0, 0, basalt);
  var bankW = gridW + 1.2;
  addBox(bankW, 0.5, 2, CX, -0.05, -(YMIN - 1) + 0.5, new THREE.MeshStandardMaterial({ color: 0x2f5550, roughness: 0.85 }));
  addBox(bankW, 0.5, 2, CX, -0.05, (YMAX + 1) * -1 - 0.5, new THREE.MeshStandardMaterial({ color: 0x7d6226, roughness: 0.85 }));

  /* Grid lines and axes */
  var lp = [];
  for (var gx = XMIN; gx <= XMAX + 1; gx++) lp.push(gx - 0.5, 0.02, -(YMAX + 0.5), gx - 0.5, 0.02, -(YMIN - 0.5));
  for (var gy = YMIN; gy <= YMAX + 1; gy++) lp.push(XMIN - 0.5, 0.02, -(gy - 0.5), XMAX + 0.5, 0.02, -(gy - 0.5));
  var lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp), 3));
  board.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0xffb366, transparent: true, opacity: 0.38 })));
  var axisMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
  addBox(gridW, 0.05, 0.08, CX, 0.04, 0, axisMat);
  addBox(0.08, 0.05, gridH, 0, 0.04, 0, axisMat);

  /* Flag at the goal */
  var pole = addBox(0.05, 1.3, 0.05, GOAL.x + 0.8, 0.85, -GOAL.y, new THREE.MeshStandardMaterial({ color: 0xe8dccf }));
  var flag = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.45), new THREE.MeshBasicMaterial({ color: 0xff6a1f, side: THREE.DoubleSide }));
  flag.position.set(GOAL.x + 1.15, 1.25, -GOAL.y); board.add(flag);

  /* ---------- Sprites (labels) ---------- */
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function makeSprite(text, o) {
    var w = o.w || 128, h = o.h || 128;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d');
    if (o.bg) { g.fillStyle = o.bg; rr(g, 2, 2, w - 4, h - 4, h / 3); g.fill(); }
    g.font = '700 ' + (o.size || 64) + 'px "Chakra Petch","Noto Sans Thai",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!o.bg) { g.lineWidth = 9; g.lineJoin = 'round'; g.strokeStyle = 'rgba(15,9,8,0.9)'; g.strokeText(text, w / 2, h / 2 + 3); }
    g.fillStyle = o.color || '#fff'; g.fillText(text, w / 2, h / 2 + 3);
    var tex = new THREE.CanvasTexture(c);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
    var sc = o.scale || 0.8;
    s.scale.set(sc * w / h, sc, 1); s.renderOrder = 10;
    return s;
  }
  function buildLabels() {
    var i, s;
    for (i = XMIN; i <= XMAX; i++) {
      s = makeSprite(fmt(i), { color: '#ffe3b0', scale: 0.5 }); s.position.set(i, 0.3, 0.55); board.add(s);
    }
    for (i = YMIN; i <= YMAX; i++) {
      if (i === 0) continue;
      s = makeSprite(fmt(i), { color: '#ffe3b0', scale: 0.5 }); s.position.set(-0.58, 0.3, -i); board.add(s);
    }
    s = makeSprite('x', { color: '#ffc233', size: 80, scale: 0.7 }); s.position.set(XMAX + 0.95, 0.3, 0); board.add(s);
    s = makeSprite('y', { color: '#ffc233', size: 80, scale: 0.7 }); s.position.set(0.7, 0.3, -(YMAX + 0.6)); board.add(s);
    s = makeSprite('เริ่ม', { w: 256, h: 96, size: 56, color: '#0f0908', bg: '#43c6b0', scale: 0.6 });
    s.position.set(START.x - 2, 0.9, -START.y); board.add(s);
    s = makeSprite('เส้นชัย', { w: 256, h: 96, size: 56, color: '#0f0908', bg: '#ffc233', scale: 0.6 });
    s.position.set(GOAL.x - 2, 0.9, -GOAL.y); board.add(s);
  }
  var fontsReady = Promise.race([
    Promise.all([
      document.fonts.load('700 48px "Chakra Petch"'),
      document.fonts.load('700 48px "Noto Sans Thai"', 'เริ่ม')
    ]).catch(function () {}),
    new Promise(function (r) { setTimeout(r, 1500); })
  ]);
  fontsReady.then(buildLabels);

  /* ---------- Stones, hero ---------- */
  var stoneGeo = new THREE.BoxGeometry(0.88, 0.3, 0.88);
  var edgeGeo = new THREE.EdgesGeometry(stoneGeo);
  var edgeMat = new THREE.LineBasicMaterial({ color: 0x2a2220 });
  function makeStone() {
    var m = new THREE.Mesh(stoneGeo, new THREE.MeshStandardMaterial({ color: 0xb8b0a2, roughness: 0.85, metalness: 0.05, emissive: 0x000000 }));
    m.add(new THREE.LineSegments(edgeGeo, edgeMat));
    return m;
  }
  function disposeStone(s) {
    board.remove(s);
    s.material.dispose();
    s.children.forEach(function (c) { if (c.isSprite) { c.material.map.dispose(); c.material.dispose(); } });
  }

  var hero = new THREE.Group();
  (function () {
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0x43c6b0, roughness: 0.6 }));
    body.position.y = 0.25; hero.add(body);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffd9b0, roughness: 0.7 }));
    head.position.y = 0.68; hero.add(head);
    var eyeMat = new THREE.MeshBasicMaterial({ color: 0x1b0d07 });
    var eg = new THREE.SphereGeometry(0.035, 8, 8);
    [-0.075, 0.075].forEach(function (ex) { var e = new THREE.Mesh(eg, eyeMat); e.position.set(ex, 0.71, -0.18); hero.add(e); });
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.0, 0.21, 0.16, 16), new THREE.MeshStandardMaterial({ color: 0xff6a1f }));
    cap.position.y = 0.9; hero.add(cap);
  })();
  board.add(hero);

  var ring = new THREE.Mesh(
    new THREE.RingGeometry(0.5, 0.64, 4, 1, Math.PI / 4).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffc233, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false })
  );
  ring.position.y = 0.22; ring.visible = false; board.add(ring);

  /* ---------- Effects ---------- */
  var fx = [];
  var dropGeo = new THREE.SphereGeometry(0.07, 6, 6);
  var rippleGeo = new THREE.RingGeometry(0.35, 0.47, 32).rotateX(-Math.PI / 2);
  function stepFx(dt) {
    for (var i = fx.length - 1; i >= 0; i--) {
      if (fx[i].step(dt) === false) { if (fx[i].done) fx[i].done(); fx.splice(i, 1); }
    }
  }
  function clearFx() { fx.forEach(function (f) { if (f.done) f.done(); }); fx.length = 0; }
  function burst(px, pz, color, n, up) {
    for (var i = 0; i < n; i++) (function () {
      var mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
      var m = new THREE.Mesh(dropGeo, mat); m.position.set(px, 0.1, pz); board.add(m);
      var vx = (Math.random() - 0.5) * 2.6, vz = (Math.random() - 0.5) * 2.6, vy = up * (0.6 + Math.random()), t = 0, life = 0.7 + Math.random() * 0.4;
      fx.push({
        step: function (dt) { t += dt; vy -= 9 * dt; m.position.x += vx * dt; m.position.y += vy * dt; m.position.z += vz * dt; var k = t / life; mat.opacity = Math.max(0, 1 - k); m.scale.setScalar(Math.max(0.05, 1 - k * 0.6)); return k < 1; },
        done: function () { board.remove(m); mat.dispose(); }
      });
    })();
  }
  function ripple(px, pz, color) {
    var mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, side: THREE.DoubleSide, depthWrite: false });
    var m = new THREE.Mesh(rippleGeo, mat); m.position.set(px, 0.18, pz); board.add(m);
    var t = 0;
    fx.push({
      step: function (dt) { t += dt; var k = t / 0.6; m.scale.setScalar(1 + k * 1.6); mat.opacity = Math.max(0, 0.9 * (1 - k)); return k < 1; },
      done: function () { board.remove(m); mat.dispose(); }
    });
  }

  /* ---------- Game state ---------- */
  var state = 'play'; // play | cross | win | lose
  var lives = 3, mistakes = 0, hintsUsed = 0, hintKey = null, winTimer = null, toastTimer = null;
  var placed = new Map();
  var heroAnim = null;

  function setHero(px, py, h) { hero.position.set(px, h, -py); }
  function toast(msg, kind) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }
  function renderHud() {
    var h = '', i;
    for (i = 0; i < 3; i++) h += '<span class="heart' + (i < lives ? '' : ' lost') + '">♥</span>';
    $('hearts').innerHTML = h;
    $('hearts').setAttribute('aria-label', 'พลังชีวิตเหลือ ' + lives + ' จาก 3');
    var p = '';
    for (i = 0; i < needed.length; i++) p += '<span class="pip' + (i < placed.size ? ' on' : '') + '"></span>';
    $('pips').innerHTML = p;
    $('count').textContent = placed.size + '/' + needed.length;
  }
  function nextNeeded() { for (var i = 0; i < needed.length; i++) if (!placed.has(key(needed[i].x, needed[i].y))) return needed[i]; return null; }

  function dropStone(gx, gy, ok) {
    var s = makeStone(); s.position.set(gx, 2.2, -gy); board.add(s);
    var vy = 0, splashed = false;
    if (ok) {
      placed.set(key(gx, gy), s);
      fx.push({
        step: function (dt) {
          vy -= 16 * dt; s.position.y += vy * dt;
          if (s.position.y <= 0) {
            s.position.y = 0; ripple(gx, -gy, 0x43c6b0);
            var tag = makeSprite('(' + fmt(gx) + ', ' + fmt(gy) + ')', { w: 256, h: 96, size: 52, color: '#bff3e9', scale: 0.38 });
            tag.position.set(0, 0.55, 0); s.add(tag);
            return false;
          }
          return true;
        }
      });
    } else {
      fx.push({
        step: function (dt) {
          vy -= 16 * dt; s.position.y += vy * dt;
          var y = s.position.y;
          if (!splashed && y < 0.1) { splashed = true; burst(gx, -gy, 0xff6a1f, 16, 3); ripple(gx, -gy, 0xff6a1f); }
          if (y < 0.3) { var e = Math.min(1, (0.3 - y) * 2); s.material.emissive.setRGB(1.0 * e, 0.35 * e, 0.05 * e); }
          return y > -0.9;
        },
        done: function () { disposeStone(s); }
      });
    }
  }

  function tryPlace(gx, gy) {
    if (state !== 'play') return;
    if (!inRange({ x: gx, y: gy })) { toast('แตะในตารางบนบ่อลาวาเท่านั้น'); return; }
    if (placed.has(key(gx, gy))) { toast('ช่องนี้มีหินแล้ว'); return; }
    $('tip').hidden = true;
    if (gy === eqY(gx)) {
      dropStone(gx, gy, true);
      toast('ถูกต้อง! (' + fmt(gx) + ', ' + fmt(gy) + ') อยู่บนเส้นกราฟ', 'good');
      if (hintKey === key(gx, gy)) { $('hint').hidden = true; hintKey = null; }
      renderHud();
      if (placed.size === needed.length) {
        state = 'cross';
        winTimer = setTimeout(startCrossing, 800);
      }
    } else {
      dropStone(gx, gy, false);
      mistakes++; lives--;
      toast('ผิด! (' + fmt(gx) + ', ' + fmt(gy) + ') ไม่อยู่บนเส้น ลองแทนค่า x แล้วคำนวณ y ใหม่', 'bad');
      renderHud();
      if (lives <= 0) { state = 'lose'; winTimer = setTimeout(showLose, 1000); }
    }
  }

  function startCrossing() {
    var path = [{ x: START.x, y: START.y }].concat(needed.slice().sort(function (a, b) { return a.x - b.x; }), [{ x: GOAL.x, y: GOAL.y }]);
    heroAnim = { path: path, i: 0, t: 0, dur: reduceMotion ? 0.3 : 0.5 };
  }
  function stepHero(dt) {
    if (!heroAnim) return;
    var a = heroAnim; a.t += dt;
    var k = Math.min(1, a.t / a.dur), p0 = a.path[a.i], p1 = a.path[a.i + 1];
    var px = p0.x + (p1.x - p0.x) * k, py = p0.y + (p1.y - p0.y) * k;
    setHero(px, py, 0.2 + Math.sin(k * Math.PI) * 0.8);
    hero.rotation.y = Math.atan2(-(p1.x - p0.x), (p1.y - p0.y));
    if (k >= 1) {
      a.i++; a.t = 0;
      if (a.i >= a.path.length - 1) {
        heroAnim = null; setHero(GOAL.x, GOAL.y, 0.2);
        burst(GOAL.x, -GOAL.y, 0xffc233, 28, 4);
        state = 'win';
        winTimer = setTimeout(showWin, 700);
      }
    }
  }

  function openSheet(html) { $('sheet').innerHTML = html; $('modal').hidden = false; }
  function showWin() {
    var stars = Math.max(1, 3 - mistakes - hintsUsed), s = '', pts = '', i;
    for (i = 1; i <= 3; i++) s += '<span class="' + (i <= stars ? 'on' : '') + '">★</span>';
    needed.forEach(function (p) { pts += '<li>(' + fmt(p.x) + ', ' + fmt(p.y) + ')</li>'; });
    openSheet('<div class="stars" aria-label="' + stars + ' ดาว">' + s + '</div>' +
      '<h2>ข้ามลาวาได้แล้ว!</h2>' +
      '<p>จุดทั้ง ' + needed.length + ' จุดอยู่บนเส้นเดียวกัน คือ y = ' + M + 'x ' + (B < 0 ? '−' : '+') + ' ' + Math.abs(B) + '</p>' +
      '<ul class="pts">' + pts + '</ul>' +
      '<p>วางผิด ' + mistakes + ' ครั้ง · ใช้คำใบ้ ' + hintsUsed + ' ครั้ง</p>' +
      '<div class="row"><button class="btn primary" id="again">เล่นอีกครั้ง</button></div>');
    $('again').onclick = resetGame;
  }
  function showLose() {
    openSheet('<h2>หินจมลาวาหมดแล้ว</h2>' +
      '<p>ลองสังเกตรูปแบบ: เมื่อ x เพิ่มขึ้น 1 ค่า y จะเพิ่มขึ้น ' + M + ' เสมอ และเมื่อ x = 0 จะได้ y = ' + fmt(B) + '</p>' +
      '<div class="row"><button class="btn primary" id="again">ลองใหม่</button></div>');
    $('again').onclick = resetGame;
  }

  function resetGame() {
    clearTimeout(winTimer); heroAnim = null; clearFx();
    placed.forEach(disposeStone); placed.clear();
    lives = 3; mistakes = 0; hintsUsed = 0; hintKey = null; state = 'play';
    hero.rotation.y = 0; setHero(START.x, START.y, 0.2);
    $('modal').hidden = true; $('hint').hidden = true; $('tip').hidden = false; ring.visible = false;
    $('coord').textContent = 'แตะเพื่อเลือกช่อง';
    renderHud();
  }

  $('hintBtn').onclick = function () {
    if (state !== 'play') return;
    var n = nextNeeded(); if (!n) return;
    var k = key(n.x, n.y);
    if (hintKey !== k) { hintsUsed++; hintKey = k; }
    $('hintCalc').innerHTML = 'ลองแทน x = ' + fmt(n.x) + '<br>y = ' + M + '(' + fmt(n.x) + ') ' + (B < 0 ? '−' : '+') + ' ' + Math.abs(B) + ' = ' + fmt(n.y) + '<br>วางหินที่ (' + fmt(n.x) + ', ' + fmt(n.y) + ')';
    $('hint').hidden = false;
  };
  $('hintClose').onclick = function () { $('hint').hidden = true; };
  $('resetBtn').onclick = resetGame;

  /* ---------- Raycasting: screen / controller ray -> grid cell ---------- */
  var raycaster = new THREE.Raycaster();
  var plane = new THREE.Plane(), UP = new THREE.Vector3(0, 1, 0), v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
  function cellFromRay(ray) {
    root.updateMatrixWorld(true);
    plane.setFromNormalAndCoplanarPoint(UP, root.getWorldPosition(v1));
    var hit = ray.intersectPlane(plane, v2);
    if (!hit) return null;
    board.worldToLocal(hit);
    return { x: Math.round(hit.x) || 0, y: Math.round(-hit.z) || 0 };
  }
  function cellFromScreen(cx, cy) {
    var r = renderer.domElement.getBoundingClientRect();
    raycaster.setFromCamera(new THREE.Vector2((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), camera);
    return cellFromRay(raycaster.ray);
  }
  var ringTimer = null;
  function showCell(cell, keep) {
    if (cell && inRange(cell)) {
      ring.visible = true; ring.position.set(cell.x, 0.22, -cell.y);
      $('coord').textContent = 'ช่อง (' + fmt(cell.x) + ', ' + fmt(cell.y) + ')';
      clearTimeout(ringTimer);
      if (!keep) ringTimer = setTimeout(function () { ring.visible = false; }, 700);
    } else if (keep) { ring.visible = false; }
  }

  /* ---------- Orbit camera (non-AR) ---------- */
  var az = 0.0, el = 0.95, zoom = 1, baseDist = 22;
  function placeCamera() {
    var d = baseDist * zoom;
    camera.position.set(d * Math.sin(az) * Math.cos(el), d * Math.sin(el), d * Math.cos(az) * Math.cos(el));
    camera.lookAt(0, 0, 0);
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    baseDist = Math.max(19, 11.5 / (0.83 * camera.aspect));
  }
  window.addEventListener('resize', resize);
  resize();

  var xrActive = false;
  var cv = renderer.domElement, ptrs = new Map(), tap = null, lastPinch = 0;
  function pinchDist() { var a = Array.from(ptrs.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
  cv.addEventListener('pointerdown', function (e) {
    if (xrActive) return;
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) tap = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    else { tap = null; lastPinch = pinchDist(); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (xrActive) return;
    var p = ptrs.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse') showCell(cellFromScreen(e.clientX, e.clientY), true); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap.moved = true;
      if (tap && tap.moved) { az -= dx * 0.006; el = Math.max(0.3, Math.min(1.45, el + dy * 0.004)); }
    } else if (ptrs.size === 2) {
      var d = pinchDist(); if (lastPinch > 0) zoom = Math.max(0.35, Math.min(1.6, zoom * lastPinch / d)); lastPinch = d;
    }
  });
  function endPtr(e, cancelled) {
    if (!ptrs.has(e.pointerId)) return;
    var wasSingle = ptrs.size === 1;
    ptrs.delete(e.pointerId);
    if (!cancelled && wasSingle && tap && !tap.moved && performance.now() - tap.t < 500) {
      var cell = cellFromScreen(e.clientX, e.clientY);
      showCell(cell, e.pointerType === 'mouse');
      if (cell) tryPlace(cell.x, cell.y);
    }
    if (ptrs.size === 0) tap = null;
  }
  cv.addEventListener('pointerup', function (e) { endPtr(e, false); });
  cv.addEventListener('pointercancel', function (e) { endPtr(e, true); });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); zoom = Math.max(0.35, Math.min(1.6, zoom * (1 + e.deltaY * 0.001))); }, { passive: false });

  /* ---------- WebXR (immersive AR, hit-test) ---------- */
  var arOK = false, xrSession = null, hitSource = null, xrPlaced = false;
  var reticle = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.16, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffc233 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
  var controller = renderer.xr.getController(0); scene.add(controller);
  var tmpM = new THREE.Matrix4();

  function setArLabel() {
    var b = $('arBtn');
    b.textContent = xrActive ? 'ออกจาก AR' : 'โหมด AR';
    b.setAttribute('aria-disabled', (arOK || xrActive) ? 'false' : 'true');
  }
  (function detectAR() {
    try {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-ar').then(function (ok) { arOK = !!ok; setArLabel(); }, function () {});
      }
    } catch (e) {}
  })();

  $('arBtn').onclick = function () {
    if (xrActive && xrSession) { xrSession.end(); return; }
    if (!arOK) { toast('AR ใช้ได้เมื่อเปิดไฟล์นี้ผ่าน HTTPS บน Android Chrome · ตอนนี้เล่นแบบ 3 มิติบนจอได้เลย'); return; }
    startAR();
  };
  async function startAR() {
    try {
      var session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('hud') }
      });
      session.addEventListener('end', onXREnd);
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      xrSession = session; xrActive = true; xrPlaced = false;
      var viewer = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewer });
      scene.background = null; root.visible = false;
      resetGame(); setArLabel();
      toast('ขยับมือถือช้า ๆ เพื่อสแกนพื้น แล้วแตะตรงวงแหวนเพื่อวางสนาม');
    } catch (err) {
      xrActive = false; setArLabel();
      toast('เปิด AR ไม่ได้: ' + (err && err.message ? err.message : 'ไม่รองรับ'), 'bad');
    }
  }
  function onXREnd() {
    xrActive = false; xrSession = null; hitSource = null; xrPlaced = false;
    reticle.visible = false; scene.background = bgColor;
    root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.setScalar(1); root.visible = true;
    board.position.set(-CX, 0, 0);
    setArLabel(); resize();
  }
  function placeRootAtReticle() {
    var p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    reticle.matrix.decompose(p, q, s);
    var cam = renderer.xr.getCamera(camera);
    var cp = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
    root.position.copy(p); root.scale.setScalar(AR_SCALE);
    root.rotation.set(0, Math.atan2(-(p.x - cp.x), -(p.z - cp.z)), 0);
    board.position.set(-CX, 0, START.y);
    root.visible = true; xrPlaced = true;
    toast('วางสนามแล้ว แตะพื้นเพื่อวางหินได้เลย', 'good');
  }
  controller.addEventListener('select', function () {
    if (!xrActive) return;
    if (!xrPlaced) {
      if (!reticle.visible) { toast('ยังไม่เจอพื้น ลองขยับมือถือช้า ๆ'); return; }
      placeRootAtReticle(); return;
    }
    tmpM.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
    var cell = cellFromRay(raycaster.ray);
    showCell(cell, false);
    if (cell) tryPlace(cell.x, cell.y);
  });
  function xrFrame(frame) {
    if (!frame || !hitSource) return;
    if (xrPlaced) { reticle.visible = false; return; }
    var hits = frame.getHitTestResults(hitSource);
    if (hits.length) {
      var pose = hits[0].getPose(renderer.xr.getReferenceSpace());
      if (pose) { reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); return; }
    }
    reticle.visible = false;
  }
  ['hud', 'modal'].forEach(function (id) {
    $(id).addEventListener('beforexrselect', function (e) { e.preventDefault(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.card, .btn, .status'), function (el) {
    el.addEventListener('beforexrselect', function (e) { e.preventDefault(); });
  });

  /* ---------- Main loop ---------- */
  var last = performance.now();
  renderer.setAnimationLoop(function (time, frame) {
    var now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    lavaMat.uniforms.uTime.value = now / 1000 * timeScale;
    flag.rotation.y = Math.sin(now / 400) * 0.25;
    stepFx(dt); stepHero(dt);
    if (xrActive) xrFrame(frame); else placeCamera();
    renderer.render(scene, camera);
  });

  resetGame();
})();
</script>

</body></html>
